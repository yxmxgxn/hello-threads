name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["crawler/**", "README.md"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # テーブルは IF NOT EXISTS なので毎回流して問題ない
      - name: Apply D1 schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-threads --remote --file schema.sql

      # クローラ用APIの合言葉(CRAWL_TOKEN)と、サイトの目隠しの合言葉(SITE_PASS)は
      # GitHub の Secret から Worker の Secret へ流し込む
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
          secrets: |
            CRAWL_TOKEN
            SITE_PASS
        env:
          CRAWL_TOKEN: ${{ secrets.CRAWL_TOKEN }}
          SITE_PASS: ${{ secrets.SITE_PASS }}
